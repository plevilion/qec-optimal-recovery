[project]
name = "qec-optimal-recovery"
version = "0.2.0"
description = "Petz, SDP-optimal and mismatched Petz recovery for the LNCY code under amplitude damping"
readme = "README.md"
authors = [{ name = "Pierre Levilion" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "cvxpy"]

[project.urls]
Repository = "https://github.com/plevilion/qec-optimal-recovery"

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

# setuptools picks up every module in src/ automatically (src-layout discovery)
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
